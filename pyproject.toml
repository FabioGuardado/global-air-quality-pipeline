[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality"
version = "0.2.0"
description = "Pipeline de limpieza, EDA y dashboard del dataset global de calidad del aire"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
notebook = ["matplotlib>=3.8", "seaborn>=0.13", "missingno>=0.5", "jupyter"]
dashboard = ["streamlit>=1.40", "plotly>=5.20"]
dev = ["pytest>=8", "pytest-cov>=5", "nbclient>=0.10", "nbformat>=5.10", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: ejecuta el notebook completo (deselecciona con -m 'not slow')",
]
